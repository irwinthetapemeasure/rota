mark_done:
  name: Mark chore done
  description: >-
    Mark a chore's occurrence done for a date. If the chore requires approval
    (and approvals are enabled), it becomes pending a lead's check instead.
  fields:
    chore:
      name: Chore
      description: Chore id or name.
      required: true
      example: dishwasher
      selector:
        text:
    date:
      name: Date
      description: The occurrence date. Defaults to today.
      example: "2026-08-18"
      selector:
        date:
    part:
      name: Daypart
      description: For chores that run several times a day, which daypart id.
      example: lunch
      selector:
        text:
    by:
      name: By
      description: Who did it (optional). Credited the full points.
      example: Adon
      selector:
        text:
    helpers:
      name: Helpers
      description: >-
        For a shared chore: the people who did it together. The chore's points
        are split evenly among them.
      example: '["Emmit", "Ezri"]'
      selector:
        object:

approve:
  name: Approve chore
  description: Approve a pending occurrence, posting its points.
  fields:
    chore:
      name: Chore
      description: Chore id or name.
      required: true
      example: clean_bathhouse
      selector:
        text:
    date:
      name: Date
      description: The occurrence date. Defaults to today.
      selector:
        date:
    by:
      name: By
      description: The lead approving (optional).
      selector:
        text:

remind_now:
  name: Send reminders now
  description: >-
    Immediately send each active volunteer a reminder about their unfinished
    chores today (respects the Reminders setting). Handy for testing.

undo:
  name: Undo chore
  description: Revert an occurrence to not-done and remove any points it earned.
  fields:
    chore:
      name: Chore
      description: Chore id or name.
      required: true
      example: dishwasher
      selector:
        text:
    date:
      name: Date
      description: The occurrence date. Defaults to today.
      selector:
        date:

toggle_check:
  name: Toggle checklist item
  description: >-
    Tick or untick one sub-task on a chore's occurrence (progress only — it does
    not complete the chore).
  fields:
    chore:
      name: Chore
      description: Chore id or name.
      required: true
      example: clean_bathroom
      selector:
        text:
    index:
      name: Item index
      description: Zero-based index of the checklist item to toggle.
      required: true
      example: 0
      selector:
        number:
          min: 0
          mode: box
    date:
      name: Date
      description: The occurrence date. Defaults to today.
      selector:
        date:
    part:
      name: Daypart / person
      description: The daypart id, or the person for an "everyone" chore.
      selector:
        text:
